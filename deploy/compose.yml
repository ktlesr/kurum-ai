# Dokploy (Docker Compose) for the GB10 / DGX Spark. Domain + HTTPS: set in Dokploy's Domains tab (Traefik → app:3000).
# Secrets come from Dokploy's Environment tab, never from this file. Required: POSTGRES_PASSWORD, APP_ORIGIN.
# First admin: docker compose exec app sh -c 'ADMIN_PASSWORD=… node scripts/create-admin.ts admin'
# vLLM (and its "models" service) run only with COMPOSE_PROFILES=vllm; without it the stack is app + db + Ollama.
# Model weights: the one-off "models" service downloads them into the vllmmodels volume on the first deploy (needs
# internet once); later deploys find them and skip. Already on the host? VLLM_MODELS_DIR=/that/dir (README → vLLM).
name: kurum-ai-web

services:
  app:
    build:
      context: ..
      target: ${APP_TARGET:-app} # app-docling: Docling inside the image
    restart: unless-stopped
    # Not on vllm: the UI (sign-in, admin page, uploads) is up while the model downloads or loads; chat says
    # "model server unreachable" until vLLM is ready.
    depends_on:
      db: { condition: service_healthy }
    # Everything else (DEFAULT_MODEL, ALLOWED_MODELS, EMBED_URL, VISION_URL, MODEL_API_KEY, limits — README table)
    # comes from Dokploy's .env as is; only what this stack defines is set here.
    env_file:
      - path: .env
        required: false
    environment:
      # Separate fields, not a URL: any password works without URL-encoding.
      PGHOST: db
      PGUSER: kurumai
      PGDATABASE: kurumai
      PGPASSWORD: ${POSTGRES_PASSWORD:?}
      APP_ORIGIN: ${APP_ORIGIN:?} # e.g. https://ai.example.com — mutations are refused without it
      # Chat and table vision: vLLM below (prefix caching keeps follow-up questions on the same documents fast,
      # for several users at once). Embeddings: Ollama on the host via its OpenAI-compatible /v1 API.
      MODEL_PROVIDER: ${MODEL_PROVIDER:-vllm}
      MODEL_URL: ${MODEL_URL:-http://vllm:8000/v1}
      MODEL_API_KEY: ${VLLM_API_KEY:-}
      DEFAULT_MODEL: ${VLLM_MODEL_NAME:-gemma4-26b}
      ALLOWED_MODELS: ${ALLOWED_MODELS:-${VLLM_MODEL_NAME:-gemma4-26b}}
      VISION_MODEL: ${VISION_MODEL:-${VLLM_MODEL_NAME:-gemma4-26b}}
      EMBED_URL: ${EMBED_URL:-http://host.docker.internal:11434/v1}
      EMBED_MODEL: ${EMBED_MODEL:-embeddinggemma}
      # gemma4's sliding-window attention keeps 128k cheap (README); 16k made every 30-page document a section scan.
      # Same value as vLLM's --max-model-len below.
      NUM_CTX: ${NUM_CTX:-131072}
    extra_hosts: ["host.docker.internal:host-gateway"]
    volumes: [appdata:/app/.cache]
    expose: ["3000"]
    # cgroup cap for the app and its Docling child (audit S5: RLIMIT_AS breaks torch; a cgroup limit doesn't).
    mem_limit: ${APP_MEM_LIMIT:-16g}
    # One instance per database (lib/boot takes an advisory lock and refuses a second one).

  # NVIDIA's NGC vLLM image for DGX Spark / GB10 (arm64; upstream vllm/vllm-openai doesn't support GB10). Same image
  # and flags as the kurum-ai pilot (kurum-ai/compose.prod.yml). Reachable only inside this stack, and still keyed.
  # One-off: fetches the vLLM model unless a complete copy is there. .complete lists the model's files and is written
  # only after all of them (the repo's list, fetched first: no network means failure, not a false "done") are on
  # disk; each deploy checks that list offline, so a deleted file means a new download. An interrupted download
  # resumes on the next deploy. Exits 0 and stays stopped.
  models:
    profiles: [vllm]
    image: python:3.12-slim
    restart: "no"
    environment:
      M: ${VLLM_MODEL:-RedHatAI/gemma-4-26B-A4B-it-NVFP4}
      HF_TOKEN: ${HF_TOKEN:-} # only for gated models
    entrypoint: ["sh", "-c"]
    command:
      - >-
        python -c "import os, sys; d = '/models/llm/' + os.environ['M']; f = os.path.join(d, '.complete'); names = open(f).read().split() if os.path.isfile(f) else []; sys.exit(0 if names and all(os.path.isfile(os.path.join(d, n)) for n in names) else 1)"
        && echo "model hazır: $$M" && exit 0;
        pip install -q --no-cache-dir huggingface_hub==0.26.2 &&
        python -c "import os, sys, fnmatch; from huggingface_hub import list_repo_files, snapshot_download; m = os.environ['M']; t = os.environ.get('HF_TOKEN') or None; ig = ['original/*', '*.bin', '*.pth', '*.h5', '*.msgpack', '*.onnx', 'onnx/*']; want = [f for f in list_repo_files(m, token=t) if not any(fnmatch.fnmatch(f, p) for p in ig)]; d = '/models/llm/' + m; c = os.path.join(d, '.complete'); os.path.exists(c) and os.remove(c); snapshot_download(m, local_dir=d, ignore_patterns=ig, token=t); miss = [f for f in want if not os.path.isfile(os.path.join(d, f))]; miss and sys.exit('eksik dosyalar: ' + ', '.join(miss)); open(c, 'w').write('\n'.join(want))"
        && echo "model indirildi: $$M"
    volumes:
      - ${VLLM_MODELS_DIR:-vllmmodels}:/models/llm

  # Only with COMPOSE_PROFILES=vllm in the Environment tab: without a working GPU runtime the container can't start
  # and every deploy would fail. Off: chat runs on Ollama (admin page → Ayarlar → Model sunucusu).
  vllm:
    profiles: [vllm]
    image: nvcr.io/nvidia/vllm:${VLLM_VERSION:-26.09-py3}
    restart: unless-stopped
    depends_on:
      models: { condition: service_completed_successfully }
    command:
      - vllm
      - serve
      # NVFP4 (~17 GB): Blackwell FP4 reads a quarter of bf16's bytes per token, so answers come faster. Full
      # precision: VLLM_MODEL=google/gemma-4-26B-A4B-it (~52 GB).
      - /models/llm/${VLLM_MODEL:-RedHatAI/gemma-4-26B-A4B-it-NVFP4}
      - --served-model-name=${VLLM_MODEL_NAME:-gemma4-26b}
      - --host=0.0.0.0
      - --port=8000
      # Unified memory is shared with Docling, Ollama (embeddings) and the OS.
      - --gpu-memory-utilization=${VLLM_GPU_MEMORY_UTILIZATION:-0.5}
      - --max-model-len=${NUM_CTX:-131072}
      # The same documents asked about again reuse their computed prefix instead of re-reading it.
      - --enable-prefix-caching
      # Separates reasoning from the answer (the app shows "Düşünüyor…" and streams only the answer).
      - --reasoning-parser=gemma4
    environment:
      # Not ":?": compose interpolates every service, profile or not, so a required key would break the GPU-less
      # deploy. Unset = no key on vLLM; it's still reachable only inside this stack. Set it (README).
      VLLM_API_KEY: ${VLLM_API_KEY:-}
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      VLLM_NO_USAGE_STATS: "1"
      DO_NOT_TRACK: "1"
    volumes:
      - ${VLLM_MODELS_DIR:-vllmmodels}:/models/llm:ro
    ipc: host
    ulimits:
      memlock: -1
      stack: 67108864
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=4)"]
      interval: 30s
      timeout: 5s
      start_period: 15m
      retries: 5

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: kurumai
      POSTGRES_DB: kurumai
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
    volumes: [dbdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "kurumai"]
      interval: 5s
      retries: 20

volumes:
  appdata:
  dbdata:
  vllmmodels:
