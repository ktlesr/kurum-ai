name: uygulama doğrulama

on:
  push:
    paths-ignore: ["kurum-ai/**", "docs/**", "**.md"]
  pull_request:
    paths-ignore: ["kurum-ai/**", "docs/**", "**.md"]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v4 # sürümü package.json → packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      - run: pnpm build
