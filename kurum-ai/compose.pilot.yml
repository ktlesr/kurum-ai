# Aşama 1 — Pilot: Windows + Docker Desktop, host'ta çalışan Ollama.
# Başlatma: docker compose -f compose.pilot.yml up -d
#
# Not: Open WebUI bu ayarların çoğunu yalnızca İLK açılışta veritabanına yazar (PersistentConfig).
# Sonradan değiştirmek için Yönetici Paneli'ni kullanın (README, "Ayarlar hakkında önemli not").

services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:${WEBUI_VERSION:-v0.11.4}
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "${WEBUI_PORT:-3000}:8080"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - open-webui:/app/backend/data
      # Yazı boyutu/kontrast düzeltmesi; açılışta /static/custom.css olarak yayınlanır
      - ./custom.css:/app/build/static/custom.css:ro
    environment:
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:?.env dosyasında WEBUI_SECRET_KEY tanımlı değil}
      WEBUI_NAME: ${WEBUI_NAME:-Kurum AI}

      # Model sunucusu: host'taki Ollama
      ENABLE_OLLAMA_API: "true"
      OLLAMA_BASE_URL: http://host.docker.internal:11434
      ENABLE_OPENAI_API: "false"
      ENABLE_DIRECT_CONNECTIONS: "false"
      ENABLE_EVALUATION_ARENA_MODELS: "false"

      # Kullanıcılar: ilk kayıt admin olur, sonrakiler admin onayı bekler
      ENABLE_SIGNUP: "true"
      DEFAULT_USER_ROLE: pending
      DEFAULT_LOCALE: tr-TR

      # Başlık/etiket/öneri üretimi: düşünen modeller (gemma4 vb.) 1000 token'ı düşünmeye harcayıp
      # başlığı yazamıyor, sohbet adı ilk mesajın tamamı oluyor. Bu görevlerde düşünmeyi kapat.
      TASK_MODEL_PARAMS: '{"think": false, "max_tokens": 1000}'

      # Doküman RAG: embedding Ollama'daki çok dilli model ile
      RAG_EMBEDDING_ENGINE: ollama
      RAG_EMBEDDING_MODEL: ${EMBEDDING_MODEL:-embeddinggemma:latest}
      RAG_OLLAMA_BASE_URL: http://host.docker.internal:11434

      # Taranmış (görüntü) PDF'ler için OCR: Docling + Tesseract Türkçe
      CONTENT_EXTRACTION_ENGINE: docling
      DOCLING_SERVER_URL: http://docling:5001
      DOCLING_PARAMS: '{"do_ocr": "true", "ocr_engine": "tesseract", "ocr_lang": ["tur", "eng"]}'

      # Dışarı çıkan her şey kapalı
      OFFLINE_MODE: "true"
      ENABLE_WEB_SEARCH: "false"
      ENABLE_COMMUNITY_SHARING: "false"
      ENABLE_VERSION_UPDATE_CHECK: "false"
      SCARF_NO_ANALYTICS: "true"
      DO_NOT_TRACK: "true"
      ANONYMIZED_TELEMETRY: "false"

  # Doküman dönüştürme + OCR. Modeller imajın içinde; çalışırken indirme yapmaz.
  docling:
    image: ghcr.io/docling-project/docling-serve-cpu:${DOCLING_VERSION:-v1.35.0}
    container_name: docling
    restart: unless-stopped
    environment:
      # Taranmış PDF'de OCR sayfa başına ~5-10 sn sürer; 120 sn varsayılanı uzun dokümanlara yetmez
      DOCLING_SERVE_MAX_SYNC_WAIT: "1800"
    volumes:
      # İmajda Tesseract yalnızca İngilizce ile gelir; Türkçe modeli (README, Önkoşullar)
      - ./models/tessdata/tur.traineddata:/usr/share/tesseract/tessdata/tur.traineddata:ro
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 1m

volumes:
  open-webui:
