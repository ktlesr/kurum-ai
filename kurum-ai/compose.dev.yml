# Geliştirme/test: üretim yığınını (compose.prod.yml) x86 + NVIDIA GPU'lu bir bilgisayarda çalıştırır.
# Cihaz gelmeden vLLM, gpt-oss, çevrimdışı açılış ve HTTPS zincirini denemek içindir.
#
#   Windows (Git Bash / PowerShell):  COMPOSE_FILE="compose.prod.yml;compose.dev.yml"
#   Linux:                            COMPOSE_FILE="compose.prod.yml:compose.dev.yml"
#   sonra: docker compose up -d
#
# Üretimden farkları yalnızca bunlar; geri kalan her şey birebir compose.prod.yml.

# Pilot da "kurum-ai" projesi olduğu için ayrı ad: volume'lar ve container'lar çakışmaz
name: kurum-ai-dev

services:
  vllm:
    environment:
      # Docker Desktop (WSL2) altında vLLM pinned memory'yi kapatır; yeni model runner (V2) bunsuz
      # "UVA is not available" hatasıyla açılmaz. Eski runner'a dön. Linux'ta (cihazda) gerekmez.
      VLLM_USE_V2_MODEL_RUNNER: "0"

  caddy:
    # 80/443 geliştirme bilgisayarında genelde dolu
    ports: !override
      - "${DEV_HTTP_PORT:-8080}:80"
      - "${DEV_HTTPS_PORT:-8443}:443"
